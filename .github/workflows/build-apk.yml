name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply selfie brightness and rear LED assist
        run: python3 tools/apply_selfie_light_patch.py

      - name: Apply screen magnifier tap-through
        run: python3 tools/apply_screen_tap_patch.py

      - name: Apply safe tap fallback
        run: python3 tools/apply_screen_tap_fix.py

      - name: Apply WebView tap compatibility
        run: python3 tools/apply_webview_tap_fix.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fast-Magnifier-v1.5.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Magnifier-v1.5.5-APK
          path: Fast-Magnifier-v1.5.5-debug.apk
          if-no-files-found: error
