name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply selfie brightness and rear LED assist
        run: python3 tools/apply_selfie_light_patch.py

      - name: Apply camera pinch zoom and one-finger pan
        run: python3 tools/apply_camera_pinch_pan_fix.py

      - name: Fix reverse pinch and improve responsiveness
        run: python3 tools/apply_pinch_responsiveness_fix.py

      - name: Apply screen magnifier tap-through
        run: python3 tools/apply_screen_tap_patch.py

      - name: Apply safe tap fallback
        run: python3 tools/apply_screen_tap_fix.py

      - name: Apply WebView tap compatibility
        run: python3 tools/apply_webview_tap_fix.py

      - name: Apply corner resize handles and exact tap mapping
        run: python3 tools/apply_corner_resize_mapping_fix.py

      - name: Enable gesture fallback and yellow resize corners
        run: python3 tools/apply_gesture_and_corner_style_fix.py

      - name: Integrate yellow resize indicators into border
        run: python3 tools/apply_integrated_border_corner_fix.py

      - name: Add minimized floating restore bubble
        run: python3 tools/apply_minimize_bubble_patch.py

      - name: Prepare barcode patch compatibility
        run: python3 tools/prepare_barcode_patch_compat.py

      - name: Add QR and barcode recognition
        run: python3 tools/apply_barcode_scanning_patch.py

      - name: Replace live Camera auto-scan with Scan button
        run: python3 tools/apply_camera_scan_button_fix.py

      - name: Audit UI guidance
        run: python3 tools/audit_ui_guidance.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fast-Magnifier-v1.7.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Magnifier-v1.7.1-APK
          path: Fast-Magnifier-v1.7.1-debug.apk
          if-no-files-found: error
