name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply English and Canadian French beta UI
        run: |
          base64 -d tools/prepare_beta_localization.py.gz.b64 | gzip -d > /tmp/prepare_beta_localization.py
          python3 /tmp/prepare_beta_localization.py

      - name: Commit beta localization source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main
          if git diff --cached --quiet; then
            echo "Beta localization source already committed"
          else
            git commit -m "Add English and Canadian French beta UI [skip ci]"
            git push origin HEAD:main
          fi

      - name: Audit UI guidance
        run: python3 tools/audit_ui_guidance.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fast-Magnifier-v1.8.0-beta1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Magnifier-v1.8.0-beta1-APK
          path: Fast-Magnifier-v1.8.0-beta1-debug.apk
          if-no-files-found: error
